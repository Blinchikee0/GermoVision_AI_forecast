name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check germovision tests examples

      - name: Tests
        run: pytest tests -q

      # Отдельный шаг, а не просто часть общего прогона: утечка данных —
      # дефект, который делает недействительными все метрики проекта,
      # поэтому в логе CI должно быть явно видно, что защита проверена.
      - name: Проверка защиты от утечки (дефект D9)
        run: pytest tests/test_guards.py -q -k "leak or duplicate or augment"

      - name: Демонстрация величины утечки
        run: python examples/leakage_demo.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "germovision"
version = "0.1.0"
description = "Система раннего предупреждения о клинически значимых мутациях патогенов"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1", "httpx>=0.24"]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["germovision*"]

[tool.setuptools.package-data]
germovision = ["webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
